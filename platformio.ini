[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[env:potentiometer]
extends = env:teensy41
build_src_filter = -<*> +<../examples/potentiometer.cpp>

[env:button]
extends = env:teensy41
build_src_filter = -<*> +<../examples/button.cpp>

[env:combined_inputs]
extends = env:teensy41
build_src_filter = -<*> +<../examples/combined_inputs.cpp>
