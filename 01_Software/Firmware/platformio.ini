[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[env:potentiometer]
extends = env:teensy41
build_src_filter = -<*> +<../examples/potentiometer.cpp>

[env:button]
extends = env:teensy41
build_src_filter = -<*> +<../examples/button.cpp>

[env:combined_inputs]
extends = env:teensy41
build_src_filter = -<*> +<../examples/combined_inputs.cpp>

[env:analog_health]
extends = env:teensy41
build_src_filter = -<*> +<../examples/analog_health.cpp>

[env:joint_calibration]
extends = env:teensy41
build_src_filter = -<*> +<../examples/joint_calibration.cpp>

[env:system_skeleton]
extends = env:teensy41
build_src_filter = -<*> +<../examples/system_skeleton.cpp>

; Ported from the October 26 sensor and motor prototypes.
[env:sensor_testing]
extends = env:teensy41
build_src_filter = -<*> +<../examples/sensor_testing.cpp>
lib_deps = adafruit/Adafruit MPU6050

[env:full_exoskeleton_dry_run]
extends = env:teensy41
build_src_filter = -<*> +<../examples/full_exoskeleton_dry_run.cpp>
lib_deps = adafruit/Adafruit MPU6050

[env:motor_test_bench]
extends = env:teensy41
build_src_filter = -<*> +<../examples/motor_test_bench.cpp>
