name: PlatformIO firmware build
on:
  push:
    branches: [development, main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile all firmware environments
        run: pio run -e teensy41 -e potentiometer -e button -e combined_inputs -e analog_health -e joint_calibration
